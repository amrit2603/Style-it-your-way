[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "mediapipe==1.2.3",
    "numpy==2.5.5",
    "pillow==13.0.0",
    "pillow-heif==1.8.1",
    "pydantic-settings==2.16.3",
    "pypdfium2==5.15.2",
    "python-multipart==0.0.34",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Standalone launch helpers add the backend path before importing the app.
"**/scripts/*.py" = ["E402"]
