services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      VYUMI_DATA_DIR: /workspace/data
    volumes:
      - vyumi-data:/workspace/data
    ports:
      - "127.0.0.1:8000:8000"
  admin:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: admin
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3002:3000"
  client:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: client
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3003:3000"
volumes:
  vyumi-data:
